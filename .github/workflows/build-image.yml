name: build-image
#
# Publishes the engine image to ghcr.io/shakedaskayo/pensieve-engine.
#
# We deliberately use `pensieve-engine` (not `pensieve`) so this push creates a
# fresh, repo-auto-linked GHCR package on first write. The pre-existing
# `ghcr.io/shakedaskayo/pensieve` package was created user-scoped and isn't
# repo-linked, so `secrets.GITHUB_TOKEN` can't write to it; rather than
# require a manual UI click on every fresh repo clone, we ship under a
# new name that the runner's auto token has `packages: write` for.
#
# If you'd rather publish to `ghcr.io/shakedaskayo/pensieve`, link the
# package at github.com/users/shakedaskayo/packages/container/pensieve/settings
# and rename `pensieve-engine` back below.
#
# Tagging scheme:
#   push to main      → :<short_sha> + :edge          (amd64 only, fast feedback)
#   release tag vX.Y.Z → :vX.Y.Z + :latest            (amd64 + arm64)
# `pensieve deploy` (deploy/terraform) pins the release tag matching the CLI version.
#
# Release images are built on native runners and joined into one manifest.
# A single buildx job that emulates arm64 with QEMU does not finish inside
# the 6-hour GitHub-hosted runner limit (v0.1.1 was cancelled that way).
# workflow_dispatch input `tag` republishes an existing release tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "crates/**"
      - "web/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish as :tag and :latest (for example v0.1.1). Empty publishes :edge from the selected ref."
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  # ── main: amd64 :edge ────────────────────────────────────────────────────
  edge:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="ghcr.io/${OWNER_LC}/pensieve-engine"
          {
            echo "short_sha=$SHORT_SHA"
            echo "tags=${REPO}:${SHORT_SHA},${REPO}:edge"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=gha,scope=edge
          cache-to: type=gha,scope=edge,mode=max
          provenance: false

      - name: Summary
        run: |
          echo "Pushed:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ── release tag: native amd64 + arm64, then one manifest ─────────────────
  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
            artifact: digest-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: digest-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch'
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER_LC}/pensieve-engine" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.artifact }}
          cache-to: type=gha,scope=${{ matrix.artifact }},mode=max
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error

  release-manifest:
    needs: release
    if: >-
      needs.release.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-22.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LC}/pensieve-engine"
          if [ -n "$INPUT_TAG" ]; then
            VERSION="$INPUT_TAG"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          cd /tmp/digests
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)
          {
            echo "Pushed:"
            echo '```'
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
