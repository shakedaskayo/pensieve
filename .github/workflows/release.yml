name: Release

# Cuts a GitHub Release with prebuilt `pensieve` CLI binaries (the install.sh path)
# plus the Tauri desktop bundles. crates.io publishing is a SEPARATE, manual
# workflow (publish-crates.yml) — see the note there about the arrow-arith
# patch, which means `cargo install pensieve-cli` can't build downstream yet.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.0.1)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── CLI binaries (native per arch so the bundled ONNX/embedding deps resolve
  #    the right platform artifacts — no cross-compile) ────────────────────
  build-cli:
    name: CLI — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            target: aarch64-apple-darwin
            artifact: pensieve-darwin-arm64
          - name: macOS (Intel)
            os: macos-14   # cross-compile x86_64 on Apple Silicon; macos-13 (Intel) runners are scarce/queued
            target: x86_64-apple-darwin
            artifact: pensieve-darwin-x64
          - name: Linux (x86_64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: pensieve-linux-x64
          - name: Linux (ARM64)
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: pensieve-linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with: { version: 9 }

      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: "pnpm" }

      # The CLI embeds the web UI (pensieve-web-assets) at compile time, so the
      # frontend must be built BEFORE the Rust build.
      - name: Build web UI
        run: |
          pnpm install --frozen-lockfile
          # web imports @pensieve-ai/client + @pensieve-ai/react via their built dist/
          pnpm build:packages
          pnpm -C web build

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p pensieve-cli

      - name: Package binary
        run: |
          mkdir -p dist
          # pensieve-cli's build output is `pensieve-cli`; end users get it as `pensieve`.
          cp "target/${{ matrix.target }}/release/pensieve-cli" dist/pensieve
          cd dist
          tar czf "${{ matrix.artifact }}.tar.gz" pensieve
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz*

  # ── Desktop app (Tauri bundles) — best-effort, never blocks the release ──
  build-desktop:
    name: Desktop — ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: "pnpm" }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm -C web build
      - run: pnpm -C web tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: pensieve-desktop-${{ matrix.os }}
          path: web/src-tauri/target/release/bundle/**

  # ── GitHub Release ───────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-cli, build-desktop]
    # Cut the release as long as the CLI binaries built; desktop is best-effort.
    if: always() && needs.build-cli.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/ || echo "no artifacts"

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: pensieve ${{ steps.tag.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.version, '-') }}
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
